<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-main: #1b1d24;
      --bg-card: #252830;
      --bg-input: #15161c;
      --text-main: #e0e6ed;
      --text-muted: #8b92a5;
      --accent-cyan: #00e5ff;
      --accent-purple: #b53cff;
      --border-color: #333845;
    }

    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      margin: 0;
      padding: 30px;
      background: var(--bg-main);
      color: var(--text-main);
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-color); }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    h2 { font-size: 24px; margin: 0; background: -webkit-linear-gradient(0deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header img { height: 32px; width: 32px; border-radius: 4px; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; }
    .grid-container-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; margin-top: 20px; }
    @media (max-width: 900px) {
      .grid-container, .grid-container-2col { grid-template-columns: 1fr; }
    }

    .section-label {
      font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--accent-purple); margin-top: 30px; margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color); padding-bottom: 6px;
    }

    .group { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .group-title { font-weight: 600; font-size: 16px; margin-bottom: 15px; color: var(--accent-cyan); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

    label { font-size: 11px; font-weight: 600; display: block; margin-top: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="password"], input[type="file"], input[type="number"], input[type="text"], textarea, select {
      width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px;
      background: var(--bg-input); border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-main); font-size: 13px; outline: none; transition: border 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent-purple); }
    textarea { height: 50px; resize: vertical; }

    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    details.advanced { margin-top: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 6px; background: rgba(0,0,0,0.1); }
    details.advanced summary { padding: 10px; cursor: pointer; font-size: 12px; font-weight: bold; color: var(--accent-purple); outline: none; user-select: none; }
    .advanced-content { padding: 15px; border-top: 1px solid var(--border-color); }

    .asset-row { display: flex; gap: 15px; margin-bottom: 15px; align-items: flex-start; border: 1px dashed var(--border-color); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.1); }
    .asset-col { flex: 1; }
    .row-number { font-weight: bold; font-size: 16px; color: var(--accent-purple); margin-right: 5px; padding-top: 10px; min-width: 22px; }

    .slot-sublabel { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 8px; display: block; }

    .primary-btn {
      width: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      color: white; border: none; cursor: pointer; font-weight: bold; font-size: 14px;
      padding: 14px; border-radius: 6px; margin-top: 20px; transition: opacity 0.2s;
    }
    .primary-btn:hover { opacity: 0.85; }
    .primary-btn:disabled { cursor: not-allowed; }

    .success-btn { width: 100%; background: #00c853; color: white; border: none; cursor: pointer; font-weight: bold; padding: 14px; margin-top: 15px; border-radius: 6px; display: none; }
    .success-btn:hover { background: #00e676; }

    #status { margin-top: 20px; font-size: 14px; font-weight: bold; text-align: center; color: var(--accent-cyan); white-space: pre-wrap; }

    .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
    .gallery img, .gallery video { width: calc(33% - 15px); border-radius: 8px; border: 1px solid var(--border-color); }

    .footer { margin-top: 40px; text-align: center; border-top: 1px solid var(--border-color); padding-top: 20px; }
    .footer-main { font-size: 14px; color: var(--text-main); margin-bottom: 4px; }
    .footer-sub { font-size: 11px; color: var(--text-muted); }
    .footer-version { font-size: 11px; color: var(--text-muted); margin-top: 6px; opacity: 0.75; }
  </style>
</head>
<body>
  <div class="header">
    <h2>AI Engine</h2>
    <img src="icon48.png" alt="AI Engine Logo">
  </div>

  <div class="group" style="margin-bottom: 20px;">
    <div class="group-title">Authentication</div>
    <label>fal.ai API Key</label>
    <input type="password" id="apiKey" placeholder="Enter your $FAL_KEY">
  </div>

  <div class="section-label">🖼️ Image Models</div>
  <div id="imageModelsGrid" class="grid-container"></div>

  <div class="section-label">🎬 Video Models</div>
  <div id="videoModelsGrid" class="grid-container-2col"></div>

  <div id="status"></div>
  <button class="success-btn" id="downloadBtn">Download Generated Assets</button>
  <div class="gallery" id="outputGallery"></div>

  <div class="footer">
    <div class="footer-main">Made with &#10084;&#65039; by MM Creative Services</div>
    <div class="footer-sub">Developed by Rushab Shah. &copy; 2026. All rights reserved</div>
    <div class="footer-version">Version <span id="appVersion">2.8</span></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
